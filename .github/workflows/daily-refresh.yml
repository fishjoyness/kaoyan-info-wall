name: 每日刷新计算机考研信息墙

on:
  schedule:
    # UTC 1:45 = 北京时间 9:45
    - cron: '45 1 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 从 CloudStudio 下载最新 HTML
        run: |
          curl -s -L -o index.html "https://848b34de1ab44e27bc63c5f0de24665c.bj10.agentos-app.net" || echo "下载失败，使用仓库现有版本"
          if [ ! -f index.html ] || [ ! -s index.html ]; then
            echo "下载失败，保留仓库现有 index.html"
          else
            echo "下载成功，大小: $(wc -c < index.html) 字节"
          fi

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取研招网新数据并更新 HTML
        run: python scripts/fetch_news.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "无更新" || git commit -m "自动刷新: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') 计算机考研信息墙"
          git push
