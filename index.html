<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Studio - 云端开发，化繁为简</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background-color: rgba(255, 255, 255, 1);
    }

    .image {
      width: 220px;
      height: 140px;
      margin-bottom: 32px;
    }

    .text {
        font-family: PingFang SC;
        font-size: 16px;
        font-weight: 500;
        line-height: 24px;
        text-align: center;
        text-underline-position: from-font;
        text-decoration-skip-ink: none;
        color: #12161b;
        margin-bottom: 16px;
    }

    .button {
        padding: 5px 11px;
        background-color: #1F67FE;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-family: PingFang SC;
        font-weight: 500;
        font-size: 14px;
        line-height: 22px;
        letter-spacing: 0px;
        text-align: center;
        vertical-align: middle;
    }

    .button:hover {
      background-color: #3f7cff;
    }
    .button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .details {
      margin-top: 28px;
      font-size: 12px;
      color: #8A95A7;
      text-align: center;
      max-width: 480px;
      padding: 0 16px;
    }
    .details summary {
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: inline-block;
      color: #8A95A7;
    }
    .details summary::-webkit-details-marker {
      display: none;
    }
    .details summary:hover {
      color: #455267;
    }
    .details[open] summary {
      margin-bottom: 8px;
    }
    .details-body {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      color: #8A95A7;
      word-break: break-all;
      line-height: 18px;
    }
    .details-body div {
      margin-top: 2px;
    }
  </style>
</head>
