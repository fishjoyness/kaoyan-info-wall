// 焦虑关键词过滤
const ANXIETY_WORDS = ['弃考','焦虑','压力','崩溃','最难','绝望','放弃','emo','想哭','内耗','煎熬','卷死','死磕','心态爆炸','怀疑人生','退意'];

function isAnxiety(text){
  return ANXIETY_WORDS.some(w => text.includes(w));
}

const main = document.getElementById('main');
const timeSeg = document.getElementById('timeSeg');
const filterSeg = document.getElementById('filterSeg');
const navTabs = document.getElementById('navTabs');
let curTime = '24h';
let curFilter = 'all';

const MODULES = [
  {id:'today', title:'今日要闻', desc:'今日与近 7 天的高校招生动态', filter:(it)=>it.when===curTime},
  {id:'target', title:'★ 我的目标校', desc:'中山大学 / 南京大学 / 上海交通大学', filter:(it)=>it.isTarget && it.topic==='招生'},
  {id:'dynamic', title:'院校动态', desc:'985/211 改考统考 / 停招学硕 / 新增专业', filter:(it)=>['改考','结构','招生','时间'].includes(it.topic) && it.when==='7d' && !it.isTarget},
  {id:'exp', title:'经验帖精选', desc:'知乎高赞 + 小红书 + CSDN 优质复盘', filter:(it)=>it.topic==='经验'},
  {id:'retest', title:'复试攻略', desc:'机试真题 + 面试 + 项目陈述', filter:(it)=>it.topic==='复试'},
  {id:'adjust', title:'调剂信息', desc:'规则 + B 区 211 + 408 优势', filter:(it)=>it.topic==='调剂'},
  {id:'articles', title:'公众号论坛好文', desc:'新东方考研网 / 今日头条 / 起航考研', filter:(it)=>it.topic==='干货'},
  {id:'tools', title:'必备工具与网站', desc:'官方入口 / 学科评估 / 论坛 / 教材 / 视频课', filter:(it)=>it.topic==='工具'}
];

function renderTabs(){
  navTabs.innerHTML = '';
  MODULES.forEach(m => {
    const rawItems = DATA.items.filter(it => m.filter(it) && !isAnxiety((it.title||'')+(it.summary||'')));
    const count = filterItems(rawItems).length;
    if(count === 0) return;  // 空模块不显示 tab
    const a = document.createElement('a');
    a.href = '#mod-' + m.id;
    a.innerHTML = m.title + '<span class="n">' + count + '</span>';
    navTabs.appendChild(a);
  });
}

function filterItems(arr){
  if(curFilter === 'all') return arr;
  if(curFilter === '985') return arr.filter(it => it.type === '985');
  if(curFilter === '211') return arr.filter(it => it.type === '211');
  if(curFilter === 'tgt') return arr.filter(it => it.isTarget);
  return arr;
}

function buildModule(m){
  const rawItems = DATA.items.filter(it => m.filter(it) && !isAnxiety((it.title||'')+(it.summary||'')));
  const items = filterItems(rawItems);

  // 当前筛选下没有匹配条目，整个模块不渲染（不再显示空占位符）
  if(items.length === 0) return null;

  const sec = document.createElement('section');
  sec.className = 'module';
  sec.id = 'mod-' + m.id;
  const h = document.createElement('h2');
  h.innerHTML = '<span>' + m.title + '</span><span class="desc">' + m.desc + '</span>';
  sec.appendChild(h);

  const list = document.createElement('div');
  list.className = 'list';
  items.forEach(it => list.appendChild(buildCard(it)));
  sec.appendChild(list);
  return sec;
}

function buildCard(it){
  const card = document.createElement('div');
  card.className = 'item' + (it.isTarget ? ' tgt' : '');

  const head = document.createElement('div');
  head.className = 'head';

  if(it.type === '985' || it.type === '211'){
    const t = document.createElement('span');
    t.className = 'tag ' + (it.type === '985' ? 't985' : 't211');
    t.textContent = it.type;
    head.appendChild(t);
  }
  const topicMap = {改考:'exp',结构:'exp',招生:'art',经验:'exp',干货:'art',工具:'tool',复试:'retest',调剂:'adjust',时间:'art'};
  if(topicMap[it.topic]){
    const tt = document.createElement('span');
    tt.className = 'tag ' + topicMap[it.topic];
    tt.textContent = it.topic;
    head.appendChild(tt);
  }
  const src = document.createElement('span');
  src.className = 'src';
  src.textContent = it.source;
  head.appendChild(src);
  const tm = document.createElement('span');
  tm.className = 'time';
  tm.textContent = it.time;
  head.appendChild(tm);

  card.appendChild(head);

  const ttl = document.createElement('a');
  ttl.className = 'ttl';
  ttl.href = it.url;
  ttl.target = '_blank';
  ttl.rel = 'noopener noreferrer';
  ttl.textContent = it.title;
  card.appendChild(ttl);

  if(it.summary){
    const sum = document.createElement('div');
    sum.className = 'sum';
    sum.textContent = it.summary;
    card.appendChild(sum);
  }

  const link = document.createElement('a');
  link.className = 'link';
  link.href = it.url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.textContent = '阅读原文 →';
  card.appendChild(link);

  return card;
}

function render(){
  main.innerHTML = '';
  MODULES.forEach(m => {
    const sec = buildModule(m);
    if(sec) main.appendChild(sec);  // 空模块跳过
  });
  renderTabs();
}

timeSeg.addEventListener('click', e => {
  if(e.target.tagName !== 'BUTTON') return;
  timeSeg.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  e.target.classList.add('on');
  curTime = e.target.dataset.t;
  render();
});

filterSeg.addEventListener('click', e => {
  if(e.target.tagName !== 'BUTTON') return;
  filterSeg.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  e.target.classList.add('on');
  curFilter = e.target.dataset.f;
  render();
});

render();
</script>
